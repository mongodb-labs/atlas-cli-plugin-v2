[package]
name = "atlas-cli-rust-plugin"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mongodb-labs/atlas-cli-plugin-v2"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }

[features]
# Gates the integration tests in tests/ that drive the plugin through the
# installed Atlas CLI. Kept off by default so `cargo test` stays hermetic.
e2e-tests = []

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dist]
